/* Layout: one exercise per screen. A Seyès notebook sheet holds the posed operation (blue pen for the pupil),
   the correction sheet in green pen sits beside or below it, and a fixed action bar carries Valider. */
:root{
  --desk:#e7ebf3; --surface:#ffffff; --fg:#1c2034; --muted:#59607a; --line:#d2d8e7;
  --paper:#fffffd; --sy-major:#aab3de; --sy-minor:#e0e4f4; --margin:#e27890;
  --print:#1d2034; --ink:#1a3dc2; --cell:rgba(26,61,194,.055); --cell-main:rgba(26,61,194,.11);
  --trait:#5f69a3; --green:#137a46; --green-soft:rgba(19,122,70,.12);
  --err:#b8361f; --err-soft:#fbe8e3; --ok-soft:#e1f2e8; --warn:#9a5d07; --warn-soft:#fbf0dc;
  --accent:#1a3dc2; --accent-fg:#ffffff; --shadow:0 1px 2px rgba(28,32,52,.06),0 8px 24px rgba(28,32,52,.07);
  --f-ui:"Andika","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --f-hand:"Playwrite FR Moderne","Segoe Print","Bradley Hand","Comic Sans MS",cursive;
  --k-ui:0; --k-hand:0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#0f121a; --surface:#181d29; --fg:#e7eaf4; --muted:#9ca3bf; --line:#2a3244;
    --paper:#1b2230; --sy-major:#37425f; --sy-minor:#262e42; --margin:#a4566b;
    --print:#eef0f7; --ink:#8fb1ff; --cell:rgba(143,177,255,.07); --cell-main:rgba(143,177,255,.14);
    --trait:#7c88c0; --green:#63d69d; --green-soft:rgba(99,214,157,.14);
    --err:#ff8e76; --err-soft:#3a221f; --ok-soft:#173126; --warn:#f2b55c; --warn-soft:#352a17;
    --accent:#8fb1ff; --accent-fg:#0e1424; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --desk:#0f121a; --surface:#181d29; --fg:#e7eaf4; --muted:#9ca3bf; --line:#2a3244;
  --paper:#1b2230; --sy-major:#37425f; --sy-minor:#262e42; --margin:#a4566b;
  --print:#eef0f7; --ink:#8fb1ff; --cell:rgba(143,177,255,.07); --cell-main:rgba(143,177,255,.14);
  --trait:#7c88c0; --green:#63d69d; --green-soft:rgba(99,214,157,.14);
  --err:#ff8e76; --err-soft:#3a221f; --ok-soft:#173126; --warn:#f2b55c; --warn-soft:#352a17;
  --accent:#8fb1ff; --accent-fg:#0e1424; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--desk);color:var(--fg)}
body{font-family:var(--f-ui);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header */
.top{padding-block:14px 6px}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-family:var(--f-hand);font-weight:400;font-size:1.45rem;margin:0;letter-spacing:.01em;color:var(--ink)}
.brand .lvl{white-space:nowrap;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:.85rem;font-weight:700;color:var(--muted);cursor:pointer;font-variant-numeric:tabular-nums;padding:0}
.dot.cur{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.dot.ok{background:var(--green);border-color:var(--green);color:var(--surface)}
.dot.err{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.dot.corr{background:var(--err-soft);border-color:var(--err);color:var(--err)}
.dot:focus-visible,.btn:focus-visible,.seg button:focus-visible,.step:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}

.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;min-height:46px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);padding-inline:26px}
.btn.primary:disabled{opacity:.4;cursor:default}
.btn.fix{border-color:var(--err);color:var(--err)}
.btn.ghost{background:transparent}
.btn.small{min-height:38px;padding:6px 12px;font-size:.9rem;border-radius:10px}
a.btn{color:var(--fg);text-decoration:none}
a.btn:hover{background:var(--surface)}
.back{align-self:center}
.btn.warnish{border-color:var(--err);color:var(--err)}

/* Exercise */
main{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.ex-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;margin:10px 0 12px}
.ex-head .txt{margin-right:auto;min-width:0}
.kicker{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.consigne{margin:2px 0 0;font-size:1.15rem;text-wrap:balance}
.consigne b{font-size:1.3rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:.8rem;font-weight:700;border-radius:999px;padding:2px 10px;margin-left:8px;vertical-align:middle}
.chip.ok{background:var(--ok-soft);color:var(--green)}
.chip.err{background:var(--warn-soft);color:var(--warn)}
.chip.corr{background:var(--err-soft);color:var(--err)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 12px;min-height:40px;display:inline-flex;align-items:center;gap:7px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button svg{width:18px;height:18px}
.seg button[aria-pressed="true"]{background:var(--cell-main);color:var(--accent)}
.toolrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.sheets{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start}
.sheet-col{min-width:0;max-width:100%}
.scroller{overflow-x:auto;max-width:100%;border-radius:6px}
.sheet{position:relative;background-color:var(--paper);box-shadow:var(--shadow);border-radius:4px;
  background-image:
    linear-gradient(to right, var(--sy-major) 1px, transparent 1px),
    linear-gradient(to bottom, var(--sy-major) 1px, transparent 1px),
    linear-gradient(to bottom, var(--sy-minor) 1px, transparent 1px);
  background-size:var(--s) var(--s), var(--s) var(--s), var(--s) calc(var(--s) / 4);
  background-position:var(--ox) var(--oy);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.sheet::before{content:"";position:absolute;top:0;bottom:0;left:calc(var(--ox) - var(--s) * .45);width:2px;background:var(--margin);opacity:.8}
.sheet.locked .ink{cursor:not-allowed}
.op{position:absolute;left:var(--ox);top:var(--oy)}
.op > *{position:absolute}
.ink{position:absolute;inset:0;touch-action:none;cursor:crosshair;z-index:5}
.sheet.erase .ink{cursor:cell}

.g{width:var(--s);height:var(--s);line-height:var(--s);text-align:center;font-variant-numeric:tabular-nums}
.pr{font-family:var(--f-ui);font-size:calc(var(--s)*.6);color:var(--print);transform:translateY(calc(var(--k-ui) * -1em))}
.sign{font-family:var(--f-ui);font-size:calc(var(--s)*.62);color:var(--print);transform:translateY(calc(var(--k-ui) * -1em))}
.pc,.sc,.cc{width:calc(var(--s)*.4);margin-left:calc(var(--s)*-.2);height:var(--s);line-height:var(--s);text-align:center;font-weight:700}
.pc{font-family:var(--f-ui);font-size:calc(var(--s)*.6);color:var(--print);transform:translateY(calc(var(--k-ui) * -1em))}
.sc{font-family:var(--f-hand);font-size:calc(var(--s)*.62);color:var(--ink);transform:translateY(calc(var(--k-hand) * -1em))}
.cc{font-family:var(--f-hand);font-size:calc(var(--s)*.6);color:var(--green);transform:translateY(calc(var(--k-hand) * -1em))}
.lab{width:var(--s);text-align:center;font-size:calc(var(--s)*.24);font-weight:700;color:var(--trait);letter-spacing:.04em;line-height:1}
.trait{width:1.5px;margin-left:-.75px;background:var(--trait);opacity:.6}
.rule{height:2px;margin-top:-1px;background:var(--print);border-radius:1px}
.pot-v{width:2.5px;margin-left:-1.25px;background:var(--print)}
.pot-h{height:2.5px;margin-top:-1.25px;background:var(--print)}
.cell{width:var(--s);height:var(--s);background:var(--cell)}
.cell.main{background:var(--cell-main)}
.cell .st{position:absolute;inset:0;line-height:var(--s);text-align:center;font-family:var(--f-hand);font-size:calc(var(--s)*.6);color:var(--ink);transform:translateY(calc(var(--k-hand) * -1em));animation:pop .22s ease-out}
.cell .st.unk{color:var(--warn);font-family:var(--f-ui);font-weight:700}
.cell.wrong{box-shadow:inset 0 0 0 2.5px var(--err);border-radius:50%}
.sc.wrong{color:var(--err)}
@keyframes pop{from{opacity:0;transform:translateY(calc(var(--k-hand) * -1em)) scale(.7)}to{opacity:1}}

/* Correction */
.corr-panel{flex:1 1 340px;min-width:0;background:var(--surface);border:1.5px solid var(--green-soft);border-radius:14px;padding:14px 16px 16px;box-shadow:var(--shadow)}
.corr-panel h2{margin:0;font-family:var(--f-hand);font-weight:400;font-size:1.3rem;color:var(--green)}
.corr-panel .answer{margin:6px 0 12px;font-size:1.12rem;font-weight:700;font-variant-numeric:tabular-nums}
.corr-panel .sheet{box-shadow:none;border:1px solid var(--line)}
.cd{font-family:var(--f-hand);font-size:calc(var(--s)*.58);color:var(--green);transform:translateY(calc(var(--k-hand) * -1em))}
.cd.z{opacity:.5}
.cs{font-family:var(--f-ui);font-size:calc(var(--s)*.6);color:var(--green);transform:translateY(calc(var(--k-ui) * -1em))}
.rule.g{background:var(--green)}
.low{width:6px;height:6px;margin:calc(var(--s)*.86) 0 0 calc(var(--s)*.5 - 3px);border-radius:50%;background:var(--green);opacity:.7}
.corr-panel .sheet.focus [data-st]:not(.lit){opacity:.16}
.corr-panel .sheet [data-st]{transition:opacity .2s}
.note{margin:12px 0 4px;color:var(--muted);font-size:.95rem}
.steps{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.step{width:100%;text-align:left;border:1.5px solid transparent;background:transparent;border-radius:10px;padding:8px 10px;cursor:pointer;display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;min-width:0}
.step:hover{background:var(--green-soft)}
.step[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft)}
.step .n{width:26px;height:26px;border-radius:50%;background:var(--green);color:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.step .b{min-width:0}
.step .t{font-weight:700}
.step ul{margin:4px 0 0;padding-left:18px;font-size:.95rem;color:var(--muted)}
.step ul li{margin:1px 0}
.step .num{font-variant-numeric:tabular-nums}
.tips{display:flex;flex-wrap:wrap;gap:6px 18px;margin:12px 0 0;padding:0;list-style:none;color:var(--muted);font-size:.92rem;max-width:72ch}
.tips li{display:flex;gap:7px;align-items:flex-start}
.tips svg{width:16px;height:16px;flex:none;margin-top:3px;color:var(--ink)}

/* Summary */
.bilan{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:22px 22px 24px;margin-top:14px;max-width:760px}
.bilan h2{font-family:var(--f-hand);font-weight:400;color:var(--ink);margin:0 0 4px;font-size:1.5rem}
.score{font-size:3rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.score small{font-size:1.2rem;color:var(--muted);font-weight:400}
.bl{list-style:none;padding:0;margin:16px 0 20px;display:grid;gap:6px}
.bl li{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--desk)}
.bl .op-t{font-variant-numeric:tabular-nums;min-width:0}
.bl .res{font-size:.85rem;font-weight:700}
.bl .res.ok{color:var(--green)} .bl .res.corr{color:var(--err)} .bl .res.err{color:var(--warn)} .bl .res.todo{color:var(--muted)}
.bl button{all:unset;cursor:pointer;border-radius:6px}
.bl button:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}

/* Bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar .wrap{display:flex;align-items:center;gap:10px;padding-block:10px;flex-wrap:wrap}
.msg{flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:10px;min-height:46px}
.msg .m{border-radius:12px;padding:8px 12px;font-weight:700;min-width:0}
.msg .m.ok{background:var(--ok-soft);color:var(--green)}
.msg .m.err{background:var(--err-soft);color:var(--err)}
.msg .m.info{background:var(--warn-soft);color:var(--warn)}
.msg .m .read{display:block;font-weight:400;font-size:.86rem;color:var(--muted)}
.msg .m.hint{background:transparent;color:var(--muted);font-weight:400;padding-left:0}
.actions{display:flex;gap:10px;margin-left:auto}
@media (max-width:560px){
  body{font-size:16px}
  .btn{padding:8px 12px}
  .btn.primary{padding-inline:18px}
  .seg button span{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  return kinds.map(k => {

    do{ ex = k === 'mi' ? genMulInt() : k === 'md' ? genMulDec() : genDiv(k === 'd1' ? 1 : 2); } while(seen.has(sig(ex)));
    seen.add(sig(ex));
    return Object.assign(ex, {kind:k, vals:{}, comma:null, ink:[], status:'todo', attempts:0});
  });
}
const opText = ex => ex.type === 'mul'
  ? fmtDigits(ex.a.d, ex.a.dec) + ' × ' + fmtDigits(ex.b.d, ex.b.dec)
  : fmtInt(ex.D) + ' ÷ ' + fmtInt(ex.d);

/* ================= Arithmetic, step by step ================= */
const RANK_NAMES = ['unités', 'dizaines', 'centaines', 'milliers'];
function mulInfo(ex){
  const A = BigInt(ex.a.d), B = BigInt(ex.b.d);
  const ad = ex.a.d.split('').reverse().map(Number);
  const bd = ex.b.d.split('').reverse().map(Number);
  const partials = bd.map((m, i) => {
    const v = BigInt(m) * A, lines = [];
    let carry = 0;
    for(let j = 0; j < ad.length; j++){
      const last = j === ad.length - 1, p = ad[j] * m + carry;
      lines.push({a:ad[j], m, prev:carry, p, last, pose:p % 10, keep:Math.floor(p / 10)});
      carry = Math.floor(p / 10);
    }
    return {i, m, v, sv:(v * 10n ** BigInt(i)).toString(), lines};
  });
  const P = A * B;
  return {A, B, partials, P, Pstr:P.toString(), dec:ex.a.dec + ex.b.dec};
}
function divInfo(ex){
  const D = ex.D, d = Number(ex.d), nD = D.length;
  let firstLen = ex.d.length;
  if(Number(D.slice(0, firstLen)) < d) firstLen++;
  const steps = [];
  let P = Number(D.slice(0, firstLen)), pos = firstLen - 1;
  for(;;){
    const q = Math.floor(P / d), prod = q * d, rem = P - prod;
    const next = pos + 1 < nD ? D[pos + 1] : null;
    steps.push({P, q, prod, rem, pos, next});
    if(next === null) break;
    P = rem * 10 + Number(next); pos++;
  }
  const qStr = steps.map(s => s.q).join('');
  return {d, firstLen, steps, qStr, q:Number(qStr), r:steps[steps.length - 1].rem};
}

/* ================= Layout of the posed operation (grid units) ================= */
const RANKS = ['u', 'd', 'c', 'm', 'dm', 'cm', 'M'];
function layout(ex){
  const L = {pr:[], pcommas:[], signs:[], rules:[], inputs:[], traits:[], labels:[], pots:[]};
  if(ex.type === 'mul'){
    const na = ex.a.d.length, nb = ex.b.d.length, np = na + nb, cols = np + 1;
    Object.assign(L, {type:'mul', cols, np, na, nb});
    for(let j = 0; j < na; j++) L.pr.push({r:1, c:np - na + 1 + j, ch:ex.a.d[j], key:'a' + j});
    if(ex.a.dec) L.pcommas.push({r:1, b:cols - ex.a.dec, key:'ac'});
    for(let j = 0; j < nb; j++) L.pr.push({r:2, c:np - nb + 1 + j, ch:ex.b.d[j], key:'b' + j});
    L.signs.push({r:2, c:0, ch:'×'});
    L.rules.push({y:3, x0:0, x1:cols});
    let r = 3;
    if(nb > 1){
      for(let i = 0; i < nb; i++) L.inputs.push({g:'p' + i, r:r + i, c0:1, c1:np});
      r += nb;
      L.rules.push({y:r, x0:0, x1:cols});
    }
    L.inputs.push({g:'res', r, c0:1, c1:np, main:true, comma:true});
    L.resRow = r; L.rows = r + 1;
    L.traits.push({x0:1, x1:cols, y0:1, y1:r + 1});
    if(!ex.a.dec) for(let c = 1; c <= np; c++) L.labels.push({c, t:RANKS[np - c]});
  } else {
    const info = divInfo(ex);
    const nD = ex.D.length, nd = ex.d.length, nq = nD - nd + 1, R0 = nD + 1, Rw = Math.max(nd, nq);
    const nL = 2 * info.steps.length + 1, cols = R0 + Rw;
    Object.assign(L, {type:'div', cols, rows:1 + nL, nD, nd, nq, R0, Rw, nL});
    for(let j = 0; j < nD; j++) L.pr.push({r:0, c:1 + j, ch:ex.D[j], key:'D' + j});
    for(let j = 0; j < nd; j++) L.pr.push({r:0, c:R0 + j, ch:ex.d[j], key:'d' + j});
    L.inputs.push({g:'q', r:1, c0:R0, c1:R0 + nq - 1, main:true});
    for(let k = 0; k < nL; k++) L.inputs.push({g:'L' + k, r:1 + k, c0:1, c1:nD, left:true});
    L.pots.push({v:true, x:R0, y0:0, y1:1 + nL}, {v:false, y:1, x0:R0, x1:cols});
    L.traits.push({x0:1, x1:R0 - 1, y0:0, y1:1 + nL}, {x0:R0 + 1, x1:R0 + Rw, y0:0, y1:2});
    for(let c = 1; c <= nD; c++) L.labels.push({c, t:RANKS[nD - c]});
  }
  L.cellMap = {};
  for(const inp of L.inputs) for(let c = inp.c0; c <= inp.c1; c++) L.cellMap[inp.r + ',' + c] = inp;
  return L;
}

/* ================= Reading and grading ================= */
function readRow(vals, inp){
  let first = -1, last = -1, unk = false;
  for(let c = inp.c0; c <= inp.c1; c++){
    const v = vals[inp.r + ',' + c];
    if(v != null){ if(first < 0) first = c; last = c; if(v === '?') unk = true; }
  }
  if(first < 0) return null;
  let digits = '', gap = false;
  for(let c = first; c <= last; c++){
    const v = vals[inp.r + ',' + c];
    if(v == null){ gap = true; digits += '_'; } else digits += v;
  }
  return {first, last, digits, gap, unk};
}
function decimalsFromComma(rd, comma){
  if(comma == null) return 0;
  if(comma <= rd.first) return rd.digits.length;
  if(comma > rd.last) return 0;
  return rd.last - comma + 1;
}
const posed = (digits, dec, hasComma) => !hasComma || dec <= 0 ? digits : dec >= digits.length ? '0,' + digits : digits.slice(0, digits.length - dec) + ',' + digits.slice(digits.length - dec);
const trimZeros = s => s.replace(/^0+/, '').replace(/0+$/, '');
function grade(ex, L){
  if(ex.type === 'mul'){
    const info = mulInfo(ex), inp = L.inputs.find(i => i.g === 'res'), rd = readRow(ex.vals, inp);
    if(!rd) return {state:'incomplete', msg:'Écris ton résultat sur la dernière ligne, sous le trait.'};
    if(rd.unk) return {state:'incomplete', msg:'Un chiffre n’a pas été reconnu (?). Réécris-le par-dessus.'};
    if(rd.gap) return {state:'incomplete', msg:'Il y a une case vide au milieu de ton résultat.'};
    const sDec = decimalsFromComma(rd, ex.comma), sN = BigInt(rd.digits), eDec = info.dec;
    const equal = sDec <= eDec ? sN * 10n ** BigInt(eDec - sDec) === info.P : info.P * 10n ** BigInt(sDec - eDec) === sN;
    const read = 'J’ai lu : ' + posed(rd.digits, sDec, ex.comma != null);
    if(equal) return {state:'ok', read, msg:'Bravo, c’est juste ! ' + opText(ex) + ' = ' + fmtNice(info.Pstr, info.dec)};
    if(trimZeros(rd.digits) === trimZeros(info.Pstr)){
      if(eDec > 0 && ex.comma == null) return {state:'err', read, msg:'Les chiffres sont justes, mais tu as oublié la virgule.'};
      if(eDec === 0) return {state:'err', read, msg:'Les chiffres sont justes, mais il ne faut pas de virgule ici.'};
      return {state:'err', read, msg:'Les chiffres sont justes, mais la virgule n’est pas à la bonne place.'};
    }
    return {state:'err', read, msg:'Ce n’est pas le bon résultat.'};
  }
  const info = divInfo(ex);
  const qInp = L.inputs.find(i => i.g === 'q'), qr = readRow(ex.vals, qInp);
  let rr = null;
  for(const inp of L.inputs.filter(i => i.left)){ const x = readRow(ex.vals, inp); if(x) rr = x; }
  if(!qr) return {state:'incomplete', msg:'Écris le quotient sous le diviseur, à droite du trait.'};
  if(!rr) return {state:'incomplete', msg:'Écris tes calculs sous le dividende et le reste tout en bas, à gauche.'};
  if(qr.unk || rr.unk) return {state:'incomplete', msg:'Un chiffre n’a pas été reconnu (?). Réécris-le par-dessus.'};
  if(qr.gap) return {state:'incomplete', msg:'Il y a une case vide au milieu de ton quotient.'};
  if(rr.gap) return {state:'incomplete', msg:'Il y a une case vide au milieu de ta dernière ligne.'};
  const q = Number(qr.digits), r = Number(rr.digits);
  const read = 'J’ai lu : quotient ' + qr.digits + ', reste ' + rr.digits;
  const qOk = q === info.q, rOk = r === info.r;
  if(qOk && rOk) return {state:'ok', read, msg:'Bravo, c’est juste ! Quotient ' + fmtInt(info.q) + ', reste ' + info.r + '.'};
  if(r >= info.d && qOk) return {state:'err', read, msg:'Le quotient est juste, mais le reste doit être plus petit que ' + info.d + '.'};
  if(qOk) return {state:'err', read, msg:'Le quotient est juste, mais le reste est faux.'};
  if(rOk) return {state:'err', read, msg:'Le reste est juste, mais le quotient est faux.'};
  if(r >= info.d) return {state:'err', read, msg:'Erreur : le reste doit être plus petit que le diviseur (' + info.d + ').'};
  return {state:'err', read, msg:'Le quotient et le reste ne sont pas justes.'};
}

/* ================= Handwritten digit recognition ================= */
const Model = (function(){
  let W = null;
  function load(){
    try{
      const m = JSON.parse($('model').textContent);
      W = {};
      for(const k of ['c1','c2','d1','d2']){
        const bin = atob(m[k].q), n = bin.length, f = new Float32Array(n), s = m[k].s;
        for(let i = 0; i < n; i++){ let b = bin.charCodeAt(i); if(b > 127) b -= 256; f[i] = b * s; }
        W[k] = f;
      }
      for(const k of ['b1','b2','e1','e2']) W[k] = Float32Array.from(m[k]);
    } catch(e){ W = null; }
  }
  function conv(inp, H, Wd, Ci, w, b, Co, K){
    const oh = H - K + 1, ow = Wd - K + 1, out = new Float32Array(oh * ow * Co);
    for(let y = 0; y < oh; y++) for(let x = 0; x < ow; x++){
      const o = (y * ow + x) * Co;
      for(let oc = 0; oc < Co; oc++) out[o + oc] = b[oc];
      for(let ky = 0; ky < K; ky++) for(let kx = 0; kx < K; kx++){
        const ib = ((y + ky) * Wd + (x + kx)) * Ci, wb = (ky * K + kx) * Ci * Co;
        for(let ic = 0; ic < Ci; ic++){
          const v = inp[ib + ic];
          if(v === 0) continue;
          const wr = wb + ic * Co;
          for(let oc = 0; oc < Co; oc++) out[o + oc] += v * w[wr + oc];
        }
      }
    }
    return {out, oh, ow};
  }
  function reluPool(a, H, Wd, C){
    const oh = H >> 1, ow = Wd >> 1, out = new Float32Array(oh * ow * C);
    for(let y = 0; y < oh; y++) for(let x = 0; x < ow; x++) for(let c = 0; c < C; c++){
      let m = 0;
      for(let dy = 0; dy < 2; dy++) for(let dx = 0; dx < 2; dx++){ const v = a[((2 * y + dy) * Wd + 2 * x + dx) * C + c]; if(v > m) m = v; }
      out[(y * ow + x) * C + c] = m;
    }
    return out;
  }
  function dense(x, w, b, nOut, relu){
    const out = Float32Array.from(b), nIn = x.length;
    for(let i = 0; i < nIn; i++){ const v = x[i]; if(v === 0) continue; const r = i * nOut; for(let o = 0; o < nOut; o++) out[o] += v * w[r + o]; }
    if(relu) for(let o = 0; o < nOut; o++) if(out[o] < 0) out[o] = 0;
    return out;
  }
  function logits(img){
    const a = conv(img, 28, 28, 1, W.c1, W.b1, 16, 5);
    const p1 = reluPool(a.out, 24, 24, 16);
    const b = conv(p1, 12, 12, 16, W.c2, W.b2, 32, 5);
    const p2 = reluPool(b.out, 8, 8, 32);
    const h = dense(p2, W.d1, W.e1, 64, true);
    return dense(h, W.d2, W.e2, 10, false);
  }
  function render28(strokes, r28){
    const RES = 4, R = 112, img = new Float32Array(R * R), r = r28 * RES;
    for(const st0 of strokes){
      const st = st0.length === 1 ? [st0[0], st0[0]] : st0;
      for(let i = 0; i < st.length - 1; i++){
        const ax = st[i][0] * RES, ay = st[i][1] * RES, bx = st[i + 1][0] * RES, by = st[i + 1][1] * RES;
        const x0 = Math.max(0, Math.floor(Math.min(ax, bx) - r - 1)), x1 = Math.min(R, Math.ceil(Math.max(ax, bx) + r + 1));
        const y0 = Math.max(0, Math.floor(Math.min(ay, by) - r - 1)), y1 = Math.min(R, Math.ceil(Math.max(ay, by) + r + 1));
        const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy;
        for(let y = y0; y < y1; y++){
          const py = y + 0.5;
          for(let x = x0; x < x1; x++){
            const px = x + 0.5;
            let t = L2 < 1e-9 ? 0 : ((px - ax) * dx + (py - ay) * dy) / L2;
            t = t < 0 ? 0 : t > 1 ? 1 : t;
            const ex = px - (ax + t * dx), ey = py - (ay + t * dy);
            let v = r + 0.5 - Math.hypot(ex, ey);
            if(v > 0){ if(v > 1) v = 1; const k = y * R + x; if(v > img[k]) img[k] = v; }
          }
        }
      }
    }
    const out = new Float32Array(784);
    for(let y = 0; y < 28; y++) for(let x = 0; x < 28; x++){
      let s = 0;
      for(let j = 0; j < 4; j++) for(let i = 0; i < 4; i++) s += img[(y * 4 + j) * R + x * 4 + i];
      out[y * 28 + x] = Math.fround(s / 16);
    }
    return out;
  }
  function normalize(strokes, r28){
    let mnx = Infinity, mny = Infinity, mxx = -Infinity, mxy = -Infinity;
    for(const st of strokes) for(const p of st){ if(p[0] < mnx) mnx = p[0]; if(p[1] < mny) mny = p[1]; if(p[0] > mxx) mxx = p[0]; if(p[1] > mxy) mxy = p[1]; }
    const w = mxx - mnx, h = mxy - mny, m = Math.max(w, h), s = m > 1e-6 ? 18 / m : 1;
    const ox = (28 - w * s) / 2, oy = (28 - h * s) / 2;
    let pts = strokes.map(st => st.map(p => [(p[0] - mnx) * s + ox, (p[1] - mny) * s + oy]));
    let img = render28(pts, r28);
    let tot = 0, cx = 0, cy = 0;
    for(let y = 0; y < 28; y++) for(let x = 0; x < 28; x++){ const v = img[y * 28 + x]; tot += v; cx += v * (x + 0.5); cy += v * (y + 0.5); }
    if(tot <= 0) return img;
    const sx = 14 - cx / tot, sy = 14 - cy / tot;
    pts = pts.map(st => st.map(p => [p[0] + sx, p[1] + sy]));
    return render28(pts, r28);
  }
  function recognize(strokes){
    if(!W) return {d:null, p:0, probs:null};
    const lg = logits(normalize(strokes, 1.25));
    let mx = -Infinity; for(const v of lg) if(v > mx) mx = v;
    let sum = 0; const pr = lg.map(v => { const e = Math.exp(v - mx); sum += e; return e; });
    let best = 0; for(let i = 1; i < 10; i++) if(pr[i] > pr[best]) best = i;
    return {d:best, p:pr[best] / sum, probs:Array.from(pr, v => v / sum)};
  }
  load();
  return {recognize, normalize, logits, ready:() => !!W};
})();

function measureFonts(){

const PAD = {l:1.5, r:0.6, t:0.9, b:0.6};
function sizeFor(L, avail, min, max){
  return Math.max(min, Math.min(max, Math.floor(avail / (L.cols + PAD.l + PAD.r))));
}
function sheetFrame(el, L, s){
  const ox = Math.round(PAD.l * s), oy = Math.round(PAD.t * s);
  el.style.setProperty('--s', s + 'px');
  el.style.setProperty('--ox', ox + 'px');
  el.style.setProperty('--oy', oy + 'px');
  el.style.width = Math.round((L.cols + PAD.l + PAD.r) * s) + 'px';
  el.style.height = Math.round((L.rows + PAD.t + PAD.b) * s) + 'px';
  return {ox, oy};
}
const at = (c, r, s) => 'left:' + (c * s) + 'px;top:' + (r * s) + 'px';
function frameHTML(L, s, corr){

    h += '<div class="cell' + (inp.main ? ' main' : '') + '" data-k="' + inp.r + ',' + c + '" style="' + at(c, inp.r, s) + '"></div>';

/* ================= Ink engine ================= */
const Ink = {
  s:60, ox:0, oy:0, mode:'pen', penSeen:false, canvas:null, ctx:null, sheet:null, dpr:1,
  active:null, pending:new Map(), recent:new Map(), cursor:null,
  attach(canvas, sheet){
    this.canvas = canvas; this.sheet = sheet;
    this.dpr = Math.min(3, window.devicePixelRatio || 1);
    const w = sheet.clientWidth, h = sheet.clientHeight;
    canvas.width = Math.round(w * this.dpr); canvas.height = Math.round(h * this.dpr);
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    this.ctx = canvas.getContext('2d');
    canvas.addEventListener('pointerdown', onDown);

function onDown(e){

  if(e.button > 0 && e.pointerType === 'mouse') return;
  e.preventDefault();
  if(isLocked()){ flash('Cet exercice est terminé. Passe au suivant ou commence une nouvelle série.', 'info'); return; }
  try{ Ink.canvas.setPointerCapture(e.pointerId); } catch(_){}
  const p = Ink.toGrid(e);

/* What a finished stroke means: a digit in a cell, a comma, or free scratch ink (carries, minus signs, lines) */
function strokeDone(pts){

  const maxDim = Math.max(bb.w, bb.h);
  if(big){ addScratch(pts); return; }
  const hit = cellAt(bb.cx, bb.cy);
  // Comma: a small mark low in the result row (or just under it), snapped to the nearest line between two columns
  const rr = LAY.resRow;
  if(rr != null && maxDim < 0.34 && bb.cy > rr + 0.55 && bb.cy < rr + 1.3){
    const inp = LAY.inputs.find(i => i.comma);
    const b = Math.max(inp.c0 + 1, Math.min(inp.c1, Math.round(bb.cx)));
    const g0 = hit ? Ink.pending.get(hit.k) : null;
    if(bb.cx > inp.c0 - 0.2 && bb.cx < inp.c1 + 1.2 && !(g0 && inBB(g0.bb, bb.cx, bb.cy, 0.02))){

  clearTimeout(g.timer);

function flushPending(){ for(const g of [...Ink.pending.values()]) finalize(g); }

function distSeg(p, a, b){

/* ================= Correction (green pen) ================= */
function buildCorrection(ex, L){
  const items = [], rules = [], commas = [], steps = [], stMap = {};
  const add = (m, key, i) => { m[key] = (m[key] ? m[key] + ' ' : '') + i; };
  let answer = '', note = '';
  if(ex.type === 'mul'){
    const I = mulInfo(ex), np = L.np, nb = L.nb, na = L.na;
    const intA = fmtInt(ex.a.d), intB = fmtInt(ex.b.d);
    answer = opText(ex) + ' = ' + fmtNice(I.Pstr, I.dec);
    if(I.dec) note = 'On calcule d’abord ' + intA + ' × ' + intB + ' sans s’occuper de la virgule, puis on la place à la fin.';
    const multiRow = nb > 1;
    I.partials.forEach((pt, i) => {
      const lines = pt.lines.map(l => {
        const base = pt.m + ' × ' + l.a + ' = ' + (pt.m * l.a);
        const plus = l.prev ? ', + ' + l.prev + ' de retenue = ' + l.p : '';
        const end = l.last ? ' : j’écris ' + l.p + '.' : ' : je pose ' + l.pose + (l.keep ? ', je retiens ' + l.keep + '.' : '.');
        return base + plus + end;

      let title, pre = '';
      if(multiRow){
        title = 'Ligne ' + (i + 1) + ' : ' + intA + ' × ' + pt.m + ' (chiffre des ' + RANK_NAMES[i] + ')';
        if(i === 1) pre = 'On décale d’un rang : on écrit d’abord un 0 dans la colonne des unités.';
        if(i === 2) pre = 'On décale de deux rangs : on écrit d’abord deux 0 (unités et dizaines).';
      } else title = intA + ' × ' + pt.m;
      const res = intA + ' × ' + pt.m + ' = ' + fmtInt(pt.v.toString()) + (i > 0 ? ', donc la ligne vaut ' + fmtInt(pt.sv) : '');
      steps.push({title, pre, lines, post:res});
      const si = steps.length - 1;
      ex.a.d.split('').forEach((_, j) => add(stMap, 'a' + j, si));
      add(stMap, 'b' + (nb - 1 - i), si);
      if(multiRow){
        const row = 3 + i, sv = pt.sv;
        for(let t = 0; t < sv.length; t++) items.push({r:row, c:np - sv.length + 1 + t, ch:sv[t], z:t >= sv.length - i, st:[si]});
      }
    });
    let addStep = null;
    if(multiRow){
      const parts = I.partials.map(p => fmtInt(p.sv));
      steps.push({title:'On additionne les ' + nb + ' lignes', pre:'On additionne colonne par colonne, en commençant par les unités, sans oublier les retenues.', lines:[], post:parts.join(' + ') + ' = ' + fmtInt(I.Pstr)});
      addStep = steps.length - 1;
      items.forEach(it => it.st.push(addStep));
    }
    const resSteps = [multiRow ? addStep : 0];
    let commaStep = null;
    if(I.dec){
      const aTxt = fmtDigits(ex.a.d, ex.a.dec);
      steps.push({title:'On place la virgule', pre:aTxt + ' a ' + pl(ex.a.dec, 'chiffre') + ' après la virgule et ' + intB + ' n’en a pas.', lines:['Le résultat doit donc avoir ' + pl(I.dec, 'chiffre') + ' après la virgule : on les compte en partant de la droite.'], post:fmtInt(I.Pstr) + ' devient ' + fmtDigits(I.Pstr, I.dec) + (fmtDigits(I.Pstr, I.dec) !== fmtNice(I.Pstr, I.dec) ? ', que l’on peut écrire ' + fmtNice(I.Pstr, I.dec) : '')});
      commaStep = steps.length - 1;
      add(stMap, 'ac', commaStep);
      resSteps.push(commaStep);
      commas.push({r:L.resRow, b:L.cols - I.dec, st:[commaStep]});
    }
    const P = I.Pstr;
    for(let t = 0; t < P.length; t++) items.push({r:L.resRow, c:np - P.length + 1 + t, ch:P[t], st:resSteps.slice()});

    const nqd = I.steps.length;
    // step 0: first group
    const first = D.slice(0, I.firstLen);
    const pre0 = I.firstLen > ex.d.length
      ? D.slice(0, I.firstLen - 1) + ' est plus petit que ' + d + ', on prend donc ' + first + '.'

    steps.push({title:'Combien de chiffres au quotient ?', pre:pre0, lines:[], post:'Le quotient aura ' + pl(nqd, 'chiffre') + '.'});
    for(let j = 0; j < I.firstLen; j++) add(stMap, 'D' + j, 0);

    I.steps.forEach((st, k) => {

      const lines = [];
      if(st.q === 0){
        lines.push('Dans ' + st.P + ', combien de fois ' + d + ' ? 0 fois, car ' + st.P + ' est plus petit que ' + d + '.');
        lines.push('On écrit 0 au quotient.');
      } else {
        const big = (st.q + 1) * d;
        lines.push('Dans ' + fmtInt(st.P) + ', combien de fois ' + d + ' ? ' + st.q + ' fois : ' + st.q + ' × ' + d + ' = ' + fmtInt(st.prod) + (st.q < 9 ? ' (' + (st.q + 1) + ' × ' + d + ' = ' + fmtInt(big) + ', c’est trop).' : '.'));
        lines.push('On écrit ' + st.q + ' au quotient, puis on soustrait : ' + fmtInt(st.P) + ' − ' + fmtInt(st.prod) + ' = ' + st.rem + '.');
      }
      if(st.next !== null) lines.push('On abaisse le ' + st.next + ' : on obtient ' + fmtInt(st.rem * 10 + Number(st.next)) + '.');
      steps.push({title:(k === 0 ? 'On commence par ' : 'On continue avec ') + fmtInt(st.P), pre:'', lines, post:''});
      // highlight the partial dividend where it is written
      if(remRow === 0){ for(let j = 0; j <= st.pos; j++) add(stMap, 'D' + j, si); }

      items.push({r:1, c:R0 + k, ch:String(st.q), st:[si, 'Q']});
      if(st.q > 0){
        const ps = String(st.prod);
        for(let t = 0; t < ps.length; t++) items.push({r:row, c:endC - ps.length + 1 + t, ch:ps[t], st:[si]});
        items.push({r:row, c:endC - ps.length, ch:'−', sign:true, st:[si]});
        rules.push({y:row + 1, x0:endC - Math.max(ps.length, String(st.P).length) + 1, x1:endC + 1, st:[si]});
        row++;
        const rs = String(st.rem);
        for(let t = 0; t < rs.length; t++) items.push({r:row, c:endC - rs.length + 1 + t, ch:rs[t], st:[si], rem:true});

      if(st.next !== null){

    const fin = steps.length;
    steps.push({title:'Le résultat', pre:'Il n’y a plus de chiffre à abaisser : ' + I.r + (I.r < d ? ' est plus petit que ' + d + ', c’est le reste.' : ''), lines:['Quotient : ' + fmtInt(I.q) + ' — reste : ' + I.r + '.'], post:'Vérification : (' + d + ' × ' + fmtInt(I.q) + ') + ' + I.r + ' = ' + fmtInt(D) + ' et ' + I.r + ' < ' + d + '.'});

  }
  return {items, rules, commas, steps, stMap, answer, note};
}
function renderCorrection(){

  for(const cm of C.commas) h += '<span class="cc" data-st="' + cm.st.join(' ') + '" style="left:' + cm.b * s + 'px;top:' + cm.r * s + 'px">,</span>';

    ((st.pre || st.lines.length || st.post) ? '<ul>' + (st.pre ? '<li>' + esc(st.pre) + '</li>' : '') + st.lines.map(l => '<li>' + esc(l) + '</li>').join('') + (st.post ? '<li><b class="num">' + esc(st.post) + '</b></li>' : '') + '</ul>' : '') +

}
let focused = -1;

  if(ex.type === 'mul'){
    const I = mulInfo(ex), P = I.Pstr, r = L.resRow;
    for(let c = 1; c <= L.np; c++){
      const idx = c - (L.np - P.length + 1), exp = idx >= 0 ? P[idx] : null, v = ex.vals[r + ',' + c];
      if((v ?? null) !== exp) mark(r + ',' + c);
    }
    const expC = I.dec ? L.cols - I.dec : null, sc = $('scomma');
    if(sc) sc.classList.toggle('wrong', ex.comma !== expC);
  } else {
    const I = divInfo(ex);
    for(let t = 0; t < L.nq; t++){ const k = '1,' + (L.R0 + t), exp = I.qStr[t] ?? null, v = ex.vals[k]; if((v ?? null) !== exp) mark(k); }
    let last = null;
    for(const inp of L.inputs.filter(i => i.left)){ const rd = readRow(ex.vals, inp); if(rd) last = {inp, rd}; }
    if(last && Number(last.rd.digits) !== I.r) for(let c = last.rd.first; c <= last.rd.last; c++) mark(last.inp.r + ',' + c);
  }
}

/* ================= Screens ================= */
const TYPE_LABEL = {mi:'Multiplication', md:'Multiplication avec virgule', d1:'Division euclidienne', d2:'Division euclidienne'};
function tipsFor(ex){
  const pen = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20l1.2-4.6L15.8 4.8a2 2 0 0 1 2.8 0l.6.6a2 2 0 0 1 0 2.8L8.6 18.8z"/></svg>';
  const t = ['Écris un chiffre par case. Si un chiffre est mal lu, réécris-le par-dessus.'];
  if(ex.type === 'mul'){
    t.push('Tes retenues : écris-les en petit au-dessus de l’opération.');
    if(ex.a.dec) t.push('La virgule : fais un petit trait en bas, sur le trait entre deux colonnes du résultat.');
  } else {
    t.push('Le quotient va sous le diviseur. Tes soustractions et le reste vont sous le dividende.');
    t.push('Le signe − et les traits peuvent s’écrire librement.');
  }
  return t.map(x => '<li>' + pen + '<span>' + esc(x) + '</span></li>').join('');
}
function renderDots(){
  $('dots').innerHTML = S.series.map((ex, i) => {
    const cls = ['dot', ex.status !== 'todo' ? ex.status : '', i === S.idx && S.view === 'ex' ? 'cur' : ''].join(' ');
    const lab = 'Exercice ' + (i + 1) + (ex.status === 'ok' ? ', juste' : ex.status === 'err' ? ', erreur' : ex.status === 'corr' ? ', corrigé' : '');
    return '<button type="button" class="' + cls + '" data-i="' + i + '" aria-label="' + lab + '"' + (i === S.idx && S.view === 'ex' ? ' aria-current="step"' : '') + '>' + (ex.status === 'ok' ? '✓' : i + 1) + '</button>';
  }).join('');
  $('dots').querySelectorAll('.dot').forEach(b => b.addEventListener('click', () => go(Number(b.dataset.i))));
}
function statusChip(ex){
  if(ex.status === 'ok') return '<span class="chip ok">Juste' + (ex.attempts > 0 ? ' au ' + (ex.attempts + 1) + 'e essai' : '') + '</span>';
  if(ex.status === 'err') return '<span class="chip err">À corriger</span>';
  if(ex.status === 'corr') return '<span class="chip corr">Corrigé</span>';
  return '';
}
function renderEx(){
  const ex = cur();
  LAY = layout(ex);
  Ink.reset();
  $('exView').hidden = false; $('bilanView').hidden = true;
  $('kicker').textContent = 'Exercice ' + (S.idx + 1) + ' sur 10 · ' + TYPE_LABEL[ex.kind];
  $('consigne').innerHTML = (ex.type === 'mul'
    ? 'Pose et calcule : <b>' + esc(opText(ex)) + '</b>'
    : 'Effectue la division euclidienne de <b>' + esc(fmtInt(ex.D)) + '</b> par <b>' + esc(ex.d) + '</b>.') + statusChip(ex);
  $('tips').innerHTML = tipsFor(ex);
  $('corr').hidden = true;
  focused = -1;
  renderStudent();
  if(ex.status === 'corr') renderCorrection();
  renderDots();
  // message from status
  if(ex.status === 'ok' || ex.status === 'err' || ex.status === 'corr'){
    const g = grade(ex, LAY);
    if(ex.status === 'corr') showMsg({state:'err', msg:g.state === 'ok' ? g.msg : 'Regarde la correction, étape par étape.', read:g.read}, false);
    else showMsg(g, ex.status === 'err');
  } else showMsg(null);
  updateButtons();
}
function updateButtons(){
  const ex = cur();
  $('btnVal').disabled = isLocked();
  $('btnVal').hidden = S.view !== 'ex';
  const last = S.idx === 9;
  $('btnNext').innerHTML = (S.view === 'bilan' ? 'Nouvelle série' : last ? 'Voir le bilan' : 'Suivant') + ' <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  $('btnClear').disabled = isLocked();
}
function showMsg(g, withFix){
  UI.msg = g;
  const box = $('msg');
  if(!g){
    box.innerHTML = '<span class="m hint">Écris ta réponse dans les cases, puis touche « Valider ».</span>';
    return;
  }
  const cls = g.state === 'ok' ? 'ok' : g.state === 'err' ? 'err' : 'info';
  box.innerHTML = '<span class="m ' + cls + '">' + esc(g.msg) + (g.read ? '<span class="read">' + esc(g.read) + '</span>' : '') + '</span>' +
    (withFix ? '<button type="button" class="btn fix" id="btnFix">Corriger</button>' : '');
  if(withFix) $('btnFix').addEventListener('click', onFix);
}
let flashT = 0;
function flash(text, kind){
  const keep = UI.msg, ex = cur();
  showMsg({state:kind, msg:text});
  clearTimeout(flashT);
  flashT = setTimeout(() => showMsg(keep, ex.status === 'err'), 2600);
}
function clearMsgIfStale(){
  const ex = cur();
  if(UI.msg && UI.msg.state === 'incomplete') showMsg(null);
  if(ex.status === 'err' && UI.msg && UI.msg.state === 'err') { /* keep the error and the Corriger button visible */ }
}

function onValidate(){
  if(S.view !== 'ex' || isLocked()) return;
  flushPending();
  const ex = cur(), g = grade(ex, LAY);
  if(g.state === 'incomplete'){ showMsg(g, ex.status === 'err'); return; }
  if(g.state === 'ok'){
    ex.status = 'ok';
    showMsg(g, false);
  } else {
    ex.status = 'err'; ex.attempts++;
    showMsg(g, true);
  }
  $('consigne').querySelector('.chip')?.remove();
  $('consigne').insertAdjacentHTML('beforeend', statusChip(ex));
  $('sheet').classList.toggle('locked', isLocked());
  renderDots(); updateButtons(); save();
}
function onFix(){
  flushPending();
  const ex = cur();
  ex.status = 'corr';
  $('consigne').querySelector('.chip')?.remove();
  $('consigne').insertAdjacentHTML('beforeend', statusChip(ex));
  renderStudent();
  renderCorrection();
  const g = grade(ex, LAY);
  showMsg({state:'err', msg:'Regarde la correction, étape par étape.', read:g.read}, false);
  renderDots(); updateButtons(); save();
  requestAnimationFrame(() => $('corr').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'nearest'}));
}
function go(i){
  if(S.view === 'ex') flushPending();
  S.idx = i; S.view = 'ex';
  save(); renderEx();
  window.scrollTo({top:0});
}
function onNext(){
  if(S.view === 'bilan'){ newSeries(); return; }
  flushPending();
  if(S.idx < 9) go(S.idx + 1);
  else showBilan();
}
function showBilan(){
  S.view = 'bilan'; save();
  const ok = S.series.filter(e => e.status === 'ok').length;
  const first = S.series.filter(e => e.status === 'ok' && e.attempts === 0).length;
  const todo = S.series.filter(e => e.status === 'todo').length;
  const label = st => st === 'ok' ? 'Juste' : st === 'corr' ? 'Corrigé' : st === 'err' ? 'Erreur' : 'Pas fait';
  const answer = ex => ex.type === 'mul' ? ' = ' + fmtNice(mulInfo(ex).Pstr, mulInfo(ex).dec) : ' → q = ' + fmtInt(divInfo(ex).q) + ', r = ' + divInfo(ex).r;
  $('bilanView').innerHTML = '<div class="bilan"><h2>Bilan de la série</h2><div class="score">' + ok + ' <small>justes sur 10</small></div>' +
    '<p class="note">' + (first ? pl(first, 'opération') + ' ' + (first > 1 ? 'réussies' : 'réussie') + ' du premier coup. ' : '') + (todo ? pl(todo, 'exercice') + ' pas encore ' + (todo > 1 ? 'faits' : 'fait') + '.' : '') + '</p>' +
    '<ul class="bl">' + S.series.map((ex, i) => '<li><span class="dot ' + (ex.status !== 'todo' ? ex.status : '') + '">' + (ex.status === 'ok' ? '✓' : i + 1) + '</span><button type="button" class="op-t" data-i="' + i + '">' + esc(opText(ex)) + (ex.status !== 'todo' ? '<span style="color:var(--muted)">' + esc(answer(ex)) + '</span>' : '') + '</button><span class="res ' + ex.status + '">' + label(ex.status) + '</span></li>').join('') + '</ul>' +
    '<button type="button" class="btn primary" id="btnAgain">Nouvelle série</button></div>';
  $('bilanView').querySelectorAll('.op-t').forEach(b => b.addEventListener('click', () => go(Number(b.dataset.i))));
  $('btnAgain').addEventListener('click', newSeries);
  $('exView').hidden = true; $('bilanView').hidden = false;
  showMsg({state:ok >= 8 ? 'ok' : 'info', msg:ok >= 8 ? 'Très beau travail !' : ok >= 5 ? 'Bon travail, continue à t’entraîner.' : 'Relis les corrections et recommence une série.'}, false);
  renderDots(); updateButtons();
  window.scrollTo({top:0});
}
function newSeries(){
  Ink.reset();
  S = freshState(); save(); renderEx();
  window.scrollTo({top:0});
}

/* Two-tap confirmations (the page cannot show dialog boxes) */
function twoStep(btn, label, confirmLabel, action){
  let armed = 0;
  btn.addEventListener('click', () => {
    if(btn.disabled) return;
    if(armed){ clearTimeout(armed); armed = 0; btn.textContent = label; btn.classList.remove('warnish'); action(); return; }
    btn.textContent = confirmLabel; btn.classList.add('warnish');
    armed = setTimeout(() => { armed = 0; btn.textContent = label; btn.classList.remove('warnish'); }, 3000);
  });
}

function setTool(m){
  Ink.mode = m;
  $('toolPen').setAttribute('aria-pressed', String(m === 'pen'));
  $('toolEraser').setAttribute('aria-pressed', String(m === 'erase'));
  $('sheet').classList.toggle('erase', m === 'erase');
  if(m === 'erase') flushPending();
  Ink.cursor = null; Ink.redraw();
}

/* ================= Boot ================= */
S = loadState();
measureFonts();
$('toolPen').addEventListener('click', () => setTool('pen'));
$('toolEraser').addEventListener('click', () => setTool('erase'));
twoStep($('btnClear'), 'Tout effacer', 'Toucher encore pour effacer', () => {
  const ex = cur(); Ink.reset(); ex.vals = {}; ex.comma = null; ex.ink = []; if(ex.status === 'err'){ /* keep the error status */ }
  renderStudent(); showMsg(ex.status === 'err' ? UI.msg : null, ex.status === 'err'); save();
});
twoStep($('btnNew'), 'Nouvelle série', 'Toucher encore : nouvelle série', newSeries);
$('btnVal').addEventListener('click', onValidate);
$('btnNext').addEventListener('click', onNext);
if(S.view === 'bilan') { renderEx(); showBilan(); } else renderEx();

let rzT = 0, lastW = window.innerWidth;
window.addEventListener('resize', () => {
  clearTimeout(rzT);
  rzT = setTimeout(() => {
    if(Math.abs(window.innerWidth - lastW) < 2) return;
    lastW = window.innerWidth;
    if(S.view !== 'ex') return;
    flushPending(); renderStudent();
    if(cur().status === 'corr') renderCorrection();
  }, 160);
});
if(document.fonts && document.fonts.load){
  Promise.all([
    document.fonts.load('400 40px "Playwrite FR Moderne"', '0123456789,'),
    document.fonts.load('700 40px "Andika"', 'Valider'),
    document.fonts.load('400 40px "Andika"', '0123456789×−')
  ]).then(() => measureFonts()).catch(() => {});
  document.fonts.ready.then(() => measureFonts());
}
// Leaving the page (link back to the home page, closing the tab): keep the last digits written
window.addEventListener('pagehide', () => {
  try{ flushPending(); } catch(e){}
  clearTimeout(saveT);
  try{ localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
});
const themeRedraw = () => Ink.redraw();
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change', themeRedraw); } catch(e){}
new MutationObserver(themeRedraw).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});

window.__ops = {mulInfo, divInfo, layout, grade, genSeries, Model, buildCorrection, readRow, fmtNice, fmtDigits};
})();
</script>
